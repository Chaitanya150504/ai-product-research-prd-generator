    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || e.reason?.message?.includes('WebSocket'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e.message && String(e.message).includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
